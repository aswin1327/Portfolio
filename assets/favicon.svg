<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9c" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Dark Cyber Shield Background -->
  <path d="M32 4 L54 13 V29 C54 44 44 55 32 60 C20 55 10 44 10 29 V13 Z" fill="#05070a" stroke="url(#cyberGrad)" stroke-width="2.5" filter="url(#neonGlow)"/>
  <!-- Circuit Nodes -->
  <circle cx="32" cy="18" r="2" fill="#00ff9c" />
  <circle cx="22" cy="30" r="1.5" fill="#00e5ff" />
  <circle cx="42" cy="30" r="1.5" fill="#00e5ff" />
  <!-- Terminal Prompt >_ -->
  <path d="M22 24 L29 31 L22 38" fill="none" stroke="#00ff9c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="33" y1="38" x2="42" y2="38" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" />
</svg>
